<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">

<title>PITBORN — Dark Arenas</title>
<meta name="description" content="PITBORN — Dark Arenas: turn-based PvP duels. Read your rival, guard the right zone, strike where he is open.">
<style>
  :root { --ink: #f3e6c8; --dim: #b9ab8f; --gold1: #fad46e; --gold2: #c8902c; --bg: #0b0a0c; }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body {
    background: var(--bg) url("bg.webp") center / cover no-repeat fixed;
    color: var(--ink);
    font-family: "Segoe UI", Roboto, Arial, sans-serif;
    display: flex; flex-direction: column; min-height: 100vh;
  }
  .shade { position: fixed; inset: 0; background: linear-gradient(180deg, rgba(5,4,6,.55), rgba(5,4,6,.82)); z-index: 0; }
  main { position: relative; z-index: 1; flex: 1; display: flex; flex-direction: column; align-items: center;
         justify-content: center; text-align: center; padding: 48px 16px 24px; }
  .logo { width: min(640px, 92vw); height: auto; filter: drop-shadow(0 8px 24px rgba(0,0,0,.6)); }
  h1 { position: absolute; left: -9999px; }
  .tag { margin: 18px 0 30px; font-size: clamp(16px, 2.6vw, 21px); letter-spacing: .06em; color: var(--ink);
         text-transform: uppercase; text-shadow: 0 2px 8px rgba(0,0,0,.8); }
  .play { display: inline-block; padding: 16px 38px; border-radius: 12px; font-weight: 800; font-size: 20px;
          letter-spacing: .05em; color: #2a1804; text-decoration: none; text-transform: uppercase;
          background: linear-gradient(180deg, var(--gold1), var(--gold2)); box-shadow: 0 8px 24px rgba(0,0,0,.55); }
  .play:hover { filter: brightness(1.08); }
  footer { position: relative; z-index: 1; padding: 18px 16px 28px; text-align: center; font-size: 15px; color: var(--dim); }
  footer a { color: var(--ink); margin: 0 10px; }
</style>
</head>
<body>
<div class="shade"></div>
<main>
  <h1>PITBORN — Dark Arenas</h1>
  <img class="logo" src="logo.webp" alt="PITBORN — Dark Arenas" width="900" height="417">
  <p class="tag">Turn-based PvP duels · Read your rival · Win</p>
  <a class="play" href="https://play.google.com/store/apps/details?id=com.nlmrd.yama">Get it on Google Play</a>
</main>
<footer>
  <a href="pitborn-legal/privacy.html">Privacy Policy</a>
  <a href="pitborn-legal/delete-account.html">Delete account</a>

</body>
</html>
